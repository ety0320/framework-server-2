services:
  mysql:
    image: mysql:8.4
    container_name: webframe
    ports:
      - "3406:3306"
    environment:
      MYSQL_DATABASE: webframework
      MYSQL_USER: webframework
      MYSQL_PASSWORD: 1234
      MYSQL_ROOT_PASSWORD: 1234
      TZ: Asia/Seoul
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -proot-local-only"]
      interval: 5s
      retries: 20
volumes:
  mysql-data: